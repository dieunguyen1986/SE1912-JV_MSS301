server:
  port: 8080
spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: job-service
              uri: http://localhost:8081
              predicates:
                - name: Path
                  args:
                    Path:
                      - /api/v1/public/jobs/**
                      - /api/v1/jobs/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10  # token nạp lại mỗi giây
                    redis-rate-limiter.burstCapacity: 20  # token tối đa
                    redis-rate-limiter.requestedTokens: 1  # mỗi request tốn 1 token
                    key-resolver: "#{@ipKeyResolver}"


            #                - name: Header
#                  args:
#                    Header: X-Client-Type, Web
            - id: candidate-service
              uri: http://localhost:8082
              predicates:
                - name: Path
                  args:
                    Path: /api/v1/candidates/**
                - name: Header
                  args:
                    Header: X-Client-Type, Web
            - id: application-service
              uri: http://localhost:8083
              predicates:
                - name: Path
                  args:
                    Path: /api/v1/application/**
                - name: Header
                  args:
                    Header: X-Client-Type, Web
            - id: cv-parse-service
              uri: http://localhost:8084
              predicates:
                - name: Path
                  args:
                    Path: /api/v1/cv-parser/**
                - name: Header
                  args:
                    Header: X-Client-Type, Web
            - id: notification-service
              uri: http://localhost:8085
              predicates:
                - name: Path
                  args:
                    Path: /api/v1/notifications/**
                - name: Header
                  args:
                    Header: X-Client-Type, Web
          globalcors:
            cors-configurations:
              [ /** ]:
                allowed-origins:
                  - "http://localhost:3000"
                  - "http://localhost:5173"
                  - "https://talenthub.fpt.edu.vn"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers: "*"
                allow-credentials: true
                max-age: 3600
management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    gateway:
      access: unrestricted
